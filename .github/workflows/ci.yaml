# Quickstart for GitHub Actions
# https://docs.github.com/en/actions/quickstart
name: fast CI
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          java: 11
          arch: x64
          runner: windows-latest
        - os: windows-latest
          java: 17
          arch: x64
          runner: windows-latest
        - os: windows-latest
          java: 21
          arch: x64
          runner: windows-latest
        - os: windows-latest
          java: 22
          arch: x64
          runner: windows-latest
        - os: windows-latest
          java: 8
          arch: x64
          runner: windows-latest
    name: Fast CI on Java ${{ matrix.java }} OS ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
        cache: maven
    - name: Build with Maven
      run: ./mvnw -V --no-transfer-progress clean package
    - name: Run unit test under ttl agent, include check for ExecutorService, 
        ForkJoinPool, Timer/TimerTask
      working-directory: ttl2-compatible
      run: >
        ../mvnw -V --no-transfer-progress
        -Penable-ttl-agent-for-test
        surefire:test
        '-Dttl.agent.extra.d.options=-Drun-ttl-test-under-agent-with-enable-timer-task=true'
    - name: Run unit test under ttl agent, and turn on the disable inheritable 
        for thread pool enhancement
      working-directory: ttl2-compatible
      run: >
        ../mvnw -V --no-transfer-progress
        -Penable-ttl-agent-for-test
        surefire:test
        '-Dttl.agent.extra.args=ttl.agent.disable.inheritable.for.thread.pool:true'
        '-Dttl.agent.extra.d.options=-Drun-ttl-test-under-agent-with-disable-inheritable=true'
    - name: Run agent check for Timer/TimerTask, explicit 
        "ttl.agent.enable.timer.task"
      working-directory: ttl2-compatible
      run: >
        ../mvnw -V --no-transfer-progress
        -Penable-ttl-agent-for-test
        surefire:test
        '-Dttl.agent.extra.args=ttl.agent.enable.timer.task:true'
        '-Dttl.agent.extra.d.options=-Drun-ttl-test-under-agent-with-enable-timer-task=true'
